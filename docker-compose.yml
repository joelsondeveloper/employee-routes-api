# Local PostgreSQL for development and manual testing (the SQLite fallback was
# removed in P0-3). Usage: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_routes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - employee-routes-db:/var/lib/postgresql/data
volumes:
  employee-routes-db:
